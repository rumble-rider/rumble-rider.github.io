<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rumble Rider · 우당탕 배달부</title>
<meta name="description" content="Rumble Rider (우당탕 배달부) — free on iOS and Android.">
<meta name="robots" content="noindex">
<link rel="icon" href="icon.png">
<script>
(function () {
  var PLAY = 'https://play.google.com/store/apps/details?id=com.nextmile.rumblerider&referrer=utm_source%3Dx%26utm_medium%3Dsocial%26utm_campaign%3Dprofile';
  var APPSTORE = 'https://apps.apple.com/app/apple-store/id6827044605?pt=129626418&ct=x_profile&mt=8';
  window.RR_LINKS = { play: PLAY, appstore: APPSTORE };
  if (/[?&]stay(=|&|$)/.test(location.search)) return;
  var ua = navigator.userAgent || '';
  var isIos = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (/Android/i.test(ua)) { location.replace(PLAY); }
  else if (isIos) { location.replace(APPSTORE); }
})();
</script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    min-height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 32px 16px;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: #fff;
    background: #2b6fd6 url("bg.png") center / cover no-repeat fixed;
  }
  body::before {
    content: ""; position: fixed; inset: 0;
    background: rgba(8, 20, 48, 0.45);
    pointer-events: none;
  }
  main { position: relative; width: 100%; max-width: 420px; text-align: center; }
  .logo { display: block; width: 100%; max-width: 360px; height: auto; margin: 0 auto 6px; }
  .ko { margin: 0 0 4px; font-size: 1.05rem; font-weight: 600; letter-spacing: 0.02em; opacity: 0.95; }
  .free { margin: 0 0 24px; font-size: 0.95rem; opacity: 0.85; }
  .stores { display: flex; flex-direction: column; gap: 12px; }
  .store {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    height: 56px; border-radius: 14px;
    background: #fff; color: #10131a; text-decoration: none;
    font-weight: 700; font-size: 1.05rem;
    box-shadow: 0 4px 0 rgba(0, 0, 0, 0.25);
  }
  .store:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0, 0, 0, 0.25); }
  .store svg { width: 22px; height: 22px; flex: none; }
  .icon { width: 72px; height: 72px; border-radius: 18px; margin: 24px auto 0; display: block; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35); }
  @media (min-width: 560px) { .stores { flex-direction: row; } .store { flex: 1; } }
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.png" alt="Rumble Rider" width="720" height="438">
  <p class="ko">우당탕 배달부</p>
  <p class="free">Free on iOS &amp; Android</p>
  <div class="stores">
    <a class="store" id="play" href="#">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#34a853" d="M3.6 2.2 13.4 12l-9.8 9.8c-.4-.2-.6-.6-.6-1.1V3.3c0-.5.2-.9.6-1.1z"/><path fill="#fbbc04" d="m16.8 8.6-3.4 3.4 3.4 3.4 3.8-2.2c.8-.5.8-1.7 0-2.2l-3.8-2.4z"/><path fill="#4285f4" d="M3.6 21.8 13.4 12l3.4 3.4-11.3 6.5c-.6.3-1.3.3-1.9-.1z"/><path fill="#ea4335" d="M3.6 2.2c.6-.4 1.3-.4 1.9-.1l11.3 6.5-3.4 3.4-9.8-9.8z"/></svg>
      Google Play
    </a>
    <a class="store" id="appstore" href="#">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#10131a" d="M16.4 12.6c0-2.4 2-3.6 2.1-3.7-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.2-2.9.9-3.7.9-.8 0-1.9-.9-3.2-.8-1.6 0-3.1 1-4 2.4-1.7 3-.4 7.4 1.2 9.8.8 1.2 1.8 2.5 3 2.4 1.2 0 1.7-.8 3.1-.8 1.5 0 1.9.8 3.2.8 1.3 0 2.2-1.2 3-2.4.9-1.4 1.3-2.7 1.3-2.8 0 0-2.5-1-2.5-3.9zM14 5.4c.7-.8 1.1-1.9 1-3-1 0-2.1.7-2.8 1.5-.6.7-1.2 1.8-1 2.9 1.1.1 2.1-.6 2.8-1.4z"/></svg>
      App Store
    </a>
  </div>
  <img class="icon" src="icon.png" alt="" width="192" height="192">
</main>
<script>
  document.getElementById('play').href = window.RR_LINKS.play;
  document.getElementById('appstore').href = window.RR_LINKS.appstore;
</script>
</body>
</html>
